<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Under Maintenance | United Technolink</title>
  <link rel="icon" type="image/png" href="/favicon-32.png">
  <style>
    :root {
      --navy: #1e3a5f;
      --green: #7ab648;
      --text: #475569;
      --bg: #f4f7fb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--bg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
    }
    .card {
      width: 100%;
      max-width: 560px;
      background: #fff;
      border-radius: 16px;
      padding: 48px 32px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(30, 58, 95, 0.08);
      border-top: 5px solid var(--green);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }
    .brand img { width: 44px; height: 44px; }
    .brand span {
      font-weight: 800;
      font-size: 22px;
      letter-spacing: 0.02em;
      color: var(--navy);
      text-transform: uppercase;
    }
    .brand span b { color: var(--green); }
    h1 {
      font-size: 28px;
      color: var(--navy);
      margin-bottom: 16px;
    }
    p { line-height: 1.6; margin-bottom: 12px; }
    .contact {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid #e2e8f0;
      font-size: 15px;
    }
    .contact strong { color: var(--navy); }
    .contact a { color: var(--green); font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <img src="/favicon-192.png" alt="">
      <span>United <b>Technolink</b></span>
    </div>
    <h1>We'll be back soon</h1>
    <p>This website is currently undergoing scheduled maintenance.</p>
    <p>Thank you for your patience.</p>
    <div class="contact">
      <p>For more information, please contact the developer,<br><strong>Abhishek Deshapande</strong>.</p>
      <!-- <p><a href="mailto:you@example.com">you@example.com</a></p> -->
    </div>
  </main>
</body>
</html>
